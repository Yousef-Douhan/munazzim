services:
  - type: web
    name: munazzim
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: TIMEZONE
        value: Asia/Hebron
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_PHONE
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
      - key: GREENAPI_ID_INSTANCE
        sync: false
      - key: GREENAPI_API_TOKEN
        sync: false
      - key: GREENAPI_API_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
